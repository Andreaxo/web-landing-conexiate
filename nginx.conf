server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para máxima velocidad
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Cabeceras de seguridad recomendadas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Redirección de /principal hacia la raíz /
    location = /principal {
        return 301 /;
    }

    # Resolución de URLs limpias sin .html (ej. /servicios -> servicios.html)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # No cachear el index.html para reflejar cambios de inmediato
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Caché optimizada para recursos estáticos (imágenes, fuentes, css, webmanifest)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|otf|ttf|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Endpoint de verificación de salud
    location /healthz {
        access_log off;
        return 200 '{"status":"ok","service":"conexiate-landing"}\n';
        add_header Content-Type application/json;
    }
}
